<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Basecamp Pings — Native</title>
<style>
  :root { --bg:#f6f5f3; --panel:#fff; --line:#e3e1dd; --muted:#6b6862; --accent:#1b8a5a; --accent-dk:#14633f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { height: 100vh; overflow: hidden; background: var(--bg);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: #2b2926; }

  /* gate (setup / connect / picker) */
  #gate { position: fixed; inset: 0; background: var(--bg); display: none; align-items: center; justify-content: center; z-index: 10; }
  #gate.show { display: flex; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 26px 28px; width: 460px; max-width: 92vw; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 6px 0 14px; color: var(--muted); }
  .card label { display: block; font-size: 12px; font-weight: 600; margin: 10px 0 4px; }
  .card input { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: inherit; }
  .card .btn { margin-top: 16px; background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px;
               font-weight: 600; cursor: pointer; font-size: 14px; }
  .card .btn:hover { background: var(--accent-dk); }
  .card .btn.secondary { background: #fff; color: var(--accent-dk); border: 1px solid var(--line); }
  .card a { color: var(--accent-dk); cursor: pointer; }
  .card .note { font-size: 12px; }
  .card code { background: #f0efed; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  .acct { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 8px;
          padding: 10px 12px; margin-top: 8px; cursor: pointer; font: inherit; }
  .acct:hover { background: #eef6f1; }
  .err { color: #b3261e; font-size: 13px; margin-top: 10px; min-height: 16px; }

  /* main app */
  #app { display: none; height: 100vh; }
  #app.show { display: flex; }
  #left { width: 320px; min-width: 320px; background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
  #left header { padding: 12px 14px; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; }
  #left header h1 { font-size: 15px; margin: 0; flex: 1; }
  #left header button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 4px 9px; cursor: pointer; font-size: 12px; }
  #left header button:hover { background: #f0efed; }
  #list { overflow-y: auto; flex: 1; }
  .group-label { padding: 10px 14px 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; gap: 10px; padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f0efed; align-items: center; background: #F0F0F0; }   /* default = (new) */
  .row:hover { background: #e6e6e6; }
  .row.replied { background: #FFFFFF; }
  .row.replied:hover { background: #faf9f7; }
  .row.active { background: #eef6f1; }     /* selected wins over (new)/(replied) */
  .row.unread .name { font-weight: 700; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; background: #ddd; flex-shrink: 0; }
  .meta { flex: 1; min-width: 0; }
  .top { display: flex; justify-content: space-between; gap: 8px; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .date { color: var(--muted); font-size: 12px; white-space: nowrap; flex-shrink: 0; }
  .excerpt { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .badge { background: var(--accent); color: #fff; border-radius: 11px; min-width: 22px; height: 22px; padding: 0 6px;
           font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .empty { padding: 22px 14px; color: var(--muted); }

  /* Right-click context menu */
  .ctxmenu { position: fixed; min-width: 160px; padding: 4px; background: #fff; border: 1px solid var(--line);
             border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.12); z-index: 100; display: none; }
  .ctxmenu.show { display: block; }
  .ctxmenu .ctx-item { display: block; width: 100%; text-align: left; padding: 7px 10px; border: 0;
                       background: transparent; cursor: pointer; font: inherit; border-radius: 5px; }
  .ctxmenu .ctx-item:hover { background: #eef6f1; }
  #right { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  #bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #bar .title { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bar button { border: 1px solid var(--line); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
  #bar button:hover { background: #f0efed; }
  #frameWrap { flex: 1; position: relative; }
  webview { width: 100%; height: 100%; border: 0; }
  #hint { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); text-align: center; padding: 40px; pointer-events: none; }

  /* Forward dialog */
  #fwdOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); display: none;
                align-items: flex-start; justify-content: center; z-index: 200; padding-top: 80px; }
  #fwdOverlay.show { display: flex; }
  .fwd-card { background: #fff; border: 1px solid var(--line); border-radius: 12px;
              width: 480px; max-width: 92vw; padding: 16px 18px;
              box-shadow: 0 10px 32px rgba(0,0,0,0.18); }
  .fwd-header { display: flex; align-items: center; gap: 8px; }
  .fwd-header h3 { margin: 0; font-size: 15px; flex: 1; }
  .fwd-close { background: transparent; border: 0; font-size: 22px; line-height: 1;
               cursor: pointer; color: var(--muted); padding: 0 4px; }
  .fwd-close:hover { color: #000; }
  .fwd-summary { margin: 10px 0 6px; font-size: 13px; color: #2b2926; }
  .fwd-summary i { color: var(--accent-dk); font-style: normal; font-weight: 600; }
  .fwd-status { font-size: 13px; color: #b3261e; min-height: 18px; margin: 4px 0; }
  .fwd-status.ok { color: var(--accent-dk); }
  #fwdSearch { width: 100%; border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; font: inherit; margin-top: 6px; }
  .fwd-list { max-height: 280px; overflow-y: auto; margin-top: 8px; }
  .fwd-item { display: flex; gap: 10px; align-items: center; padding: 8px 8px; cursor: pointer;
              border-radius: 6px; border: 0; background: transparent; width: 100%; text-align: left; font: inherit; }
  .fwd-item:hover { background: #eef6f1; }
  .fwd-item .avatar { width: 28px; height: 28px; }
  .fwd-empty { padding: 14px 8px; color: var(--muted); font-size: 13px; text-align: center; }

  /* Windows only (.win32 on <html>): scrollbars are always visible and ~17px wide,
     which eats into the fixed 320px sidebar. Restyle them thin. macOS overlay
     scrollbars are untouched — none of these selectors match without .win32. */
  .win32 #list::-webkit-scrollbar, .win32 .fwd-list::-webkit-scrollbar { width: 10px; }
  .win32 #list::-webkit-scrollbar-track, .win32 .fwd-list::-webkit-scrollbar-track { background: transparent; }
  .win32 #list::-webkit-scrollbar-thumb, .win32 .fwd-list::-webkit-scrollbar-thumb {
    background: #c9c6c0; border-radius: 5px; border: 2px solid transparent; background-clip: padding-box; }
  .win32 #list::-webkit-scrollbar-thumb:hover, .win32 .fwd-list::-webkit-scrollbar-thumb:hover { background: #a9a6a0; }
</style>
</head>
<body>
  <!-- Gate: setup / connect / account picker -->
  <div id="gate" class="show"><div class="card" id="gateCard"></div></div>

  <!-- Right-click context menu (used for "Mark as replied") -->
  <div id="ctxMenu" class="ctxmenu" role="menu">
    <button class="ctx-item" id="ctxMarkReplied">Mark as replied</button>
  </div>

  <!-- Forward dialog: opens when the toolbar Forward button is clicked.
       Driven entirely by Basecamp bookmarks (user bookmarks comments natively
       in Basecamp's UI; this app reads /my/bookmarks.json). -->
  <div id="fwdOverlay" role="dialog" aria-modal="true">
    <div class="fwd-card">
      <div class="fwd-header">
        <h3 id="fwdTitle">Forward bookmarked messages</h3>
        <button class="fwd-close" id="fwdClose" title="Cancel">&times;</button>
      </div>
      <div class="fwd-summary" id="fwdSummary"></div>
      <div class="fwd-status" id="fwdStatus"></div>
      <input id="fwdSearch" type="text" placeholder="Type to filter recipients…" autocomplete="off">
      <div id="fwdList" class="fwd-list"></div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app">
    <div id="left">
      <header>
        <h1>Pings</h1>
        <button id="settingsBtn" title="OAuth credentials (Client ID / Secret / Redirect)">⚙</button>
        <button id="acctBtn" title="Switch account">Account</button>
        <button id="signOutBtn" title="Sign out of Basecamp">Sign out</button>
        <button id="refresh">Refresh</button>
      </header>
      <div id="list"><div class="empty">Loading…</div></div>
    </div>
    <div id="right">
      <div id="bar">
        <span class="title" id="title">Select a ping — the real Basecamp chat loads here</span>
        <button id="reload" title="Reload">⟳</button>
        <button id="forwardBtn" title="Forward messages you bookmarked in Basecamp from this conversation">Forward ↪</button>
        <button id="copyBtn" title="Copy messages you bookmarked in Basecamp to the clipboard (rich text + plain text)">Copy ⧉</button>
        <button id="openExt">Open in browser ↗</button>
      </div>
      <div id="frameWrap">
        <webview id="bc" partition="persist:basecamp" allowpopups src="about:blank"></webview>
        <div id="hint">Click a person on the left to open your real Basecamp ping here<br>(full features: boosts, replies, attachments, read receipts)</div>
      </div>
    </div>
  </div>

<script>
const $ = s => document.querySelector(s);
const bp = window.bping;
// Windows: the .win32 class scopes the thin-scrollbar CSS, and window.alert()/
// confirm() are routed through native dialogs via IPC (Electron-on-Windows leaves
// keyboard input dead after them). macOS keeps native confirm()/alert() exactly.
const IS_WIN = navigator.platform.startsWith('Win');
if (IS_WIN) document.documentElement.classList.add('win32');
const askConfirm = async (msg) => IS_WIN ? await bp.confirm(msg) : confirm(msg);
const showAlert  = async (msg) => { if (IS_WIN) await bp.alert(msg); else alert(msg); };
let current = null, peopleSig = null, peopleTimer = null;
let peopleData = [];
let myself = null;   // current user { id, name } — for the "wrote to YY" forward header
const readLocally = new Set();   // chats opened this session — kept 'read' until the server catches up
let focusComposer = false;       // after opening a ping, focus Basecamp's compose box once it loads
let knownUnread = null;          // chatId -> lastDate from previous poll, to detect newly-arrived pings
let firstLoad = true;            // auto-open the most recent ping after the first successful fetch
// Conversations the user manually flagged as "(replied)" via the right-click menu.
// Stored as Map<chatId, lastDateAtMarkTime>: when lastDate advances (new activity),
// the mark expires and the row becomes (new) again.
let markedReplied = new Map();
try { markedReplied = new Map(JSON.parse(localStorage.getItem('bping:markedReplied') || '[]')); } catch (e) {}
function saveMarked() {
  try { localStorage.setItem('bping:markedReplied', JSON.stringify([...markedReplied])); } catch (e) {}
}
let away = false;                // app not focused → poll faster + lighter to catch new pings
const POLL_FOCUSED = 30000, POLL_AWAY = 10000;
const frame = $('#bc');

function relTime(iso) {
  const d = new Date(iso), now = new Date(), s = (now - d) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  if (s < 604800) return Math.floor(s / 86400) + 'd ago';
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: d.getFullYear() === now.getFullYear() ? undefined : 'numeric' });
}
function esc(s){ const d=document.createElement('div'); d.textContent=s==null?'':s; return d.innerHTML; }
function showGate(html){ $('#gate').classList.add('show'); $('#app').classList.remove('show'); $('#gateCard').innerHTML = html; }
function hideGate(){ $('#gate').classList.remove('show'); $('#app').classList.add('show'); }

// ---- boot / state machine ----
async function boot() {
  const st = await bp.getState();
  if (!st.configured) return setupScreen(st);
  if (!st.authed) return connectScreen();
  if (!st.accountId) return pickerScreen();
  startApp(st.appHref);
}

// `mode` is 'setup' on first launch (no creds yet) OR 'settings' when the
// user clicks ⚙ to edit existing creds. Edit mode lets the secret stay blank
// (keeps the current one); initial setup requires it.
function setupScreen(st, mode = 'setup') {
  const isEdit = mode === 'settings' && st.hasSecret;
  const secretPlaceholder = isEdit ? '(leave blank to keep current)' : 'paste your Client Secret';
  const headline = isEdit ? 'OAuth credentials' : 'Connect Basecamp (OAuth2)';
  const intro = isEdit
    ? `Edit your 37signals Launchpad integration credentials. Saving will sign you out (the new credentials invalidate the current Basecamp token).`
    : `This app talks to the Basecamp API directly. Register a free integration, then paste its credentials here. Stored locally in <code>${esc(st.configPath || 'config.json in the app data folder')}</code> — never sent anywhere except 37signals.`;
  const cancelBtn = isEdit ? `<button class="btn secondary" id="cancel" style="margin-top:8px;margin-left:8px">Cancel</button>` : '';
  showGate(`
    <h2>${headline}</h2>
    <p class="note">${intro}</p>
    <ol class="note" style="margin:0 0 8px 18px;padding:0">
      <li>Open <a id="reg">launchpad.37signals.com/integrations</a> and create an integration.</li>
      <li>Set its <b>Redirect URI</b> to exactly the value below.</li>
      <li>Copy the Client ID &amp; Client Secret here.</li>
    </ol>
    <label>Client ID</label><input id="cid" value="${esc(st.clientId)}" placeholder="...">
    <label>Client Secret</label><input id="csec" type="password" placeholder="${esc(secretPlaceholder)}">
    <label>Redirect URI (must match your integration)</label><input id="ruri" value="${esc(st.redirectUri || st.defaultRedirect)}">
    <div class="err" id="err"></div>
    <button class="btn" id="save">${isEdit ? 'Save changes' : 'Save &amp; continue'}</button>
    ${cancelBtn}
  `);
  $('#reg').onclick = () => bp.openExternal('https://launchpad.37signals.com/integrations');
  if (cancelBtn) $('#cancel').onclick = () => { hideGate(); boot(); };
  $('#save').onclick = async () => {
    const clientId = $('#cid').value.trim();
    const clientSecret = $('#csec').value.trim();
    const redirectUri = $('#ruri').value.trim();
    if (!clientId) { $('#err').textContent = 'Client ID is required.'; return; }
    if (!isEdit && !clientSecret) { $('#err').textContent = 'Client Secret is required.'; return; }
    const r = await bp.saveCreds({ clientId, clientSecret, redirectUri });
    if (r && r.error) { $('#err').textContent = r.error; return; }
    // If creds changed, main wiped tokens — go to connectScreen. Otherwise
    // the redirect URI might have been adjusted; reboot picks up state.
    if (r && r.credsChanged) return connectScreen();
    hideGate();
    boot();
  };
}

function connectScreen(prevError) {
  showGate(`
    <h2>Sign in to Basecamp</h2>
    <p>Clicking <b>Connect</b> opens your default browser to sign in (so passkeys and any existing Basecamp login work). After you authorize, bping picks up automatically — you can close the browser tab.</p>
    <div class="err" id="err"></div>
    <button class="btn" id="go">Connect to Basecamp</button>
  `);
  if (prevError) $('#err').textContent = prevError;
  $('#go').onclick = async () => {
    waitingScreen();
    const r = await bp.startAuth();
    if (r.error) {
      // Don't show "cancelled" as an error — it's expected feedback for Cancel.
      const msg = /cancel/i.test(r.error) ? '' : r.error;
      connectScreen(msg);
      return;
    }
    handleAccounts(r.accounts);
  };
}

function waitingScreen() {
  showGate(`
    <h2>Waiting for sign-in…</h2>
    <p>Complete the sign-in in your browser. bping will continue automatically once you authorize. You can close the browser tab after it says "Sign-in complete".</p>
    <div class="err" id="err"></div>
    <button class="btn secondary" id="cancel">Cancel</button>
  `);
  $('#cancel').onclick = () => { bp.cancelAuth(); /* startAuth promise will reject; connectScreen is shown by its handler */ };
}

async function pickerScreen() {
  showGate(`<h2>Loading accounts…</h2><div class="err" id="err"></div>`);
  const r = await bp.listAccounts();
  if (r.error) { $('#err').textContent = r.error; return; }
  handleAccounts(r.accounts);
}

function handleAccounts(accounts) {
  if (!accounts || !accounts.length) { showGate(`<h2>No Basecamp accounts</h2><p>This login has no Basecamp 3/4 accounts.</p>`); return; }
  if (accounts.length === 1) return selectAccount(accounts[0]);
  showGate(`<h2>Choose an account</h2><p>You have access to several — pick one.</p><div id="accts"></div>`);
  const box = $('#accts');
  accounts.forEach(a => {
    const b = document.createElement('button');
    b.className = 'acct'; b.textContent = a.name + '  (#' + a.id + ')';
    b.onclick = () => selectAccount(a);
    box.appendChild(b);
  });
}
async function selectAccount(a) {
  await bp.setAccount({ id: a.id, appHref: a.appHref });
  startApp(a.appHref);
}

function startApp(appHref) {
  hideGate();
  if (appHref) frame.src = appHref.replace(/\/?$/, '/');   // account home (login/session for the webview)
  firstLoad = true;            // re-arm auto-open after a fresh start (account switch / re-sign-in)
  loadPeople();
  setPoll(POLL_FOCUSED);
}

// ---- pings list ----
async function loadPeople(opts) {
  // opts.forceFull = ignore the away/light flag so manual refreshes and the
  // post-send refresh always get the latest-line correction (and thus the new
  // lastMine/excerpt/lastDate for the conversation just sent to).
  const useLight = (opts && opts.forceFull) ? false : away;
  let data;
  try { data = await bp.getPings({ light: useLight }); } catch (e) { $('#list').innerHTML = '<div class="empty">Failed to load.</div>'; return; }
  if (data.error) { $('#list').innerHTML = '<div class="empty">' + esc(data.error) + '</div>'; return; }
  if (data.me) myself = data.me;   // remember who "I" am for the forward header
  // Carry over knowledge from the previous poll. Background "light" polls skip
  // the latest-line refinement — so they return lastMine=undefined, a regressed
  // lastDate, and an excerpt without any "You: " prefix. Without this merge, a
  // row that was correctly (replied) in a focused poll would flip back to (new)
  // the next time a light poll runs. We only carry over fields when the new
  // poll shows no new activity (lastDate did not advance).
  const prevByChat = new Map((peopleData || []).map(x => [x.chat, x]));
  data.people.forEach(p => {
    const prev = prevByChat.get(p.chat);
    if (!prev) return;
    if (new Date(p.lastDate) <= new Date(prev.lastDate)) {
      if (p.lastMine === undefined && prev.lastMine !== undefined) p.lastMine = prev.lastMine;
      if (prev.excerpt) p.excerpt = prev.excerpt;
      if (new Date(prev.lastDate) > new Date(p.lastDate)) p.lastDate = prev.lastDate;
    }
  });
  data.people.forEach(p => {       // honor optimistic reads until the server agrees
    if (readLocally.has(p.chat)) {
      if (p.unread) { p.unread = false; p.unreadCount = 0; }
      else readLocally.delete(p.chat);
    }
  });
  // Expire "Mark as replied" flags only when new activity ACTUALLY arrived (lastDate
  // advanced) or the conversation went away. A date that regresses — e.g., a
  // background light-poll skipping the latest-line refinement — must NOT expire
  // the mark, otherwise the row briefly reverts to (new). That was the bug.
  let markedChanged = false;
  for (const chat of [...markedReplied.keys()]) {
    const pp = data.people.find(x => String(x.chat) === String(chat));
    if (!pp || new Date(pp.lastDate) > new Date(markedReplied.get(chat))) {
      markedReplied.delete(chat);
      markedChanged = true;
    }
  }
  if (markedChanged) saveMarked();
  const sig = JSON.stringify(data.people);
  if (sig === peopleSig) { highlightActive(); return; }
  peopleSig = sig;
  peopleData = data.people;
  renderList();
  // On the first successful load, auto-open the most recent ping (unless the user
  // already clicked one during the fetch). "Most recent" = max lastDate overall.
  if (firstLoad && !current && peopleData.length) {
    const mostRecent = peopleData.reduce((a, b) =>
      !a || new Date(b.lastDate) > new Date(a.lastDate) ? b : a, null);
    if (mostRecent) openConvo(mostRecent);
  }
  firstLoad = false;
  maybeAutoSelect(data.people);
}
// When the app isn't focused, auto-open a newly-arrived ping so it's ready when you return.
async function maybeAutoSelect(people) {
  const cur = new Map(people.filter(p => p.unread).map(p => [p.chat, p.lastDate]));
  if (knownUnread !== null) {
    const fresh = people.filter(p => p.unread &&
      (!knownUnread.has(p.chat) || new Date(p.lastDate) > new Date(knownUnread.get(p.chat))));
    if (fresh.length) {
      // Native macOS notification for each new incoming ping.
      fresh.forEach(p => bp.notify({
        title: 'New ping from ' + p.name,
        body: p.excerpt || '',
        chat: p.chat,
      }));
      let focused = true; try { focused = await bp.isFocused(); } catch (e) {}
      if (!focused) {
        fresh.sort((a, b) => new Date(b.lastDate) - new Date(a.lastDate));
        openConvo(fresh[0]);
      }
    }
  }
  knownUnread = cur;
}
function renderList() {
  const list = $('#list'); list.innerHTML = '';
  if (!peopleData.length) { list.innerHTML = '<div class="empty">No pings found.</div>'; return; }
  const unread = peopleData.filter(p => p.unread), read = peopleData.filter(p => !p.unread);
  if (unread.length) { list.appendChild(label('Unread')); unread.forEach(p => list.appendChild(rowEl(p))); }
  if (read.length) { list.appendChild(label('Earlier')); read.forEach(p => list.appendChild(rowEl(p))); }
  highlightActive();
}
function label(t){ const d=document.createElement('div'); d.className='group-label'; d.textContent=t; return d; }
function highlightActive(){ document.querySelectorAll('#list .row').forEach(r => r.classList.toggle('active', !!current && r.dataset.chat === String(current.chat))); }
function rowEl(p) {
  // "Replied" = the latest line is from me, OR the user manually marked it as replied
  // (manual marks auto-expire when this conversation's lastDate advances — see loadPeople).
  const naturallyReplied = p.lastMine !== undefined ? !!p.lastMine : (p.excerpt || '').startsWith('You: ');
  // Manual marks stay valid as long as they remain in the map — loadPeople only
  // removes them when lastDate actually advances. No strict date-equality check
  // here, which would falsely flip the row to (new) on a light-mode poll.
  const manuallyReplied = markedReplied.has(p.chat);
  const replied = naturallyReplied || manuallyReplied;
  // Suffix: show "(replied)" only when we actually replied. Manual marks get the
  // (replied) background (#FFFFFF) but NO suffix — we didn't actually reply.
  const suffix = naturallyReplied ? ' (replied)' : (manuallyReplied ? '' : ' (new)');
  const row = document.createElement('div');
  row.className = 'row' + (p.unread ? ' unread' : '') + (replied ? ' replied' : '');
  row.dataset.chat = p.chat;
  row.innerHTML = `
    <img class="avatar" src="${esc(p.avatar)}" alt="">
    <div class="meta">
      <div class="top"><span class="name"></span><span class="date">${relTime(p.lastDate)}</span></div>
      <div class="top"><span class="excerpt"></span>${p.unread && p.unreadCount ? `<span class="badge">${p.unreadCount}</span>` : ''}</div>
    </div>`;
  row.querySelector('.name').textContent = p.name + suffix;
  row.querySelector('.excerpt').textContent = p.excerpt;
  row.onclick = () => openConvo(p);
  row.oncontextmenu = (e) => {
    e.preventDefault();
    if (replied) return;          // only offer "Mark as replied" on (new) items
    showCtxMenu(p, e.clientX, e.clientY);
  };
  return row;
}
function openConvo(p) {
  current = p;
  $('#title').textContent = p.name;
  $('#hint').style.display = 'none';
  frame.src = p.appUrl;
  focusComposer = true;            // focus the message box once this ping loads
  if (p.unread) {                  // opening reads it — move to 'Earlier' immediately
    p.unread = false; p.unreadCount = 0;
    readLocally.add(p.chat);
    peopleSig = null;              // let the next server refresh re-render
    renderList();
  } else {
    highlightActive();
  }
}

$('#refresh').onclick = () => loadPeople({ forceFull: true });
// Refresh immediately when the user sends a ping in the embedded Basecamp webview.
bp.onMessageSent(() => loadPeople({ forceFull: true }));
$('#reload').onclick = () => { try { frame.reload(); } catch (e) {} };
$('#openExt').onclick = () => { if (current) bp.openExternal(current.appUrl); };

// ---- right-click "Mark as replied" context menu ----
const ctxMenu = $('#ctxMenu');

async function signOut() {
  if (!(await askConfirm('Sign out of Basecamp? You will need to sign in again to use the app.'))) return;
  // Stop polling + blank the webview FIRST. If we clear cookies while
  // Basecamp's JS is still running it can race and re-write the session
  // cookies before our clear completes — leaving the right pane logged in.
  if (peopleTimer) { clearInterval(peopleTimer); peopleTimer = null; }
  try { frame.src = 'about:blank'; } catch (e) {}
  // Clear bping's per-user state in this renderer (marked-replied flags,
  // active selection, caches). Otherwise a different user signing in after
  // this would inherit the previous user's chat-row markings.
  current = null; peopleData = []; peopleSig = null; knownUnread = null;
  readLocally.clear();
  markedReplied.clear();
  try { localStorage.removeItem('bping:markedReplied'); } catch (e) {}
  // Now ask main to wipe OAuth tokens, account config, AND the webview's
  // Basecamp session (cookies / cache / HTTP-auth / per-host cookie sweep).
  await bp.signOut();
  $('#title').textContent = 'Select a ping — the real Basecamp chat loads here';
  $('#hint').style.display = '';
  $('#list').innerHTML = '<div class="empty">Loading…</div>';
  boot();
}

// After opening a ping, focus Basecamp's message box (inside the webview) so you can type right away.
const FOCUS_JS = `(function(){var n=0;function f(){n++;var e=document.querySelector('trix-editor')||document.querySelector('[contenteditable="true"]')||document.querySelector('textarea')||document.querySelector('input[type="text"]');if(e){try{e.focus();}catch(x){}try{var s=window.getSelection(),r=document.createRange();r.selectNodeContents(e);r.collapse(false);s.removeAllRanges();s.addRange(r);}catch(x){}return;}if(n<25){setTimeout(f,150);}}f();})();`;
frame.addEventListener('did-finish-load', () => {

function setPoll(ms) { if (peopleTimer) clearInterval(peopleTimer); peopleTimer = setInterval(loadPeople, ms); }

// ---- Forward bookmarked messages ----
// Design: user bookmarks comments NATIVELY in Basecamp's "…" menu (no DOM
// injection into the embedded webview). Clicking the toolbar Forward button
// scans the recent lines in the currently-open conversation, checks each
// line's bookmark_url to see which the user has bookmarked, then sends one
// rich-text chat line to the chosen recipient with each bookmarked comment
// quoted + linked back to its author's profile. After a successful forward
// we auto-DELETE each bookmark via its bookmark_url (verified working).
//
// API caveat: bookmarks don't expose a `bookmarked_at` timestamp, so the
// originally-spec'd "past 30 minutes" filter is dropped — the dialog
// surfaces ALL currently-bookmarked lines in the chat. Auto-DELETE keeps
// the set tight in practice.
let fwdLines = [];          // bookmarked lines for the open chat, frozen at dialog open
let fwdSending = false;
const fwdOverlay  = $('#fwdOverlay');
const fwdSearch   = $('#fwdSearch');
const fwdList     = $('#fwdList');
const fwdStatusEl = $('#fwdStatus');
const fwdSummary  = $('#fwdSummary');

function setFwdStatus(msg, ok) {
  fwdStatusEl.textContent = msg || '';
  fwdStatusEl.classList.toggle('ok', !!ok);
}
function closeForward() {
  fwdOverlay.classList.remove('show');
  setFwdStatus('');
  fwdSummary.innerHTML = '';
  fwdList.innerHTML = '';
  fwdSearch.value = '';
  fwdSearch.disabled = false;
  fwdLines = [];
  fwdSending = false;
}
$('#fwdClose').onclick = closeForward;
fwdOverlay.addEventListener('click', e => { if (e.target === fwdOverlay && !fwdSending) closeForward(); });
window.addEventListener('keydown', e => {
  if (e.key === 'Escape' && fwdOverlay.classList.contains('show') && !fwdSending) closeForward();
});

// Shared scan: open the dialog with a "scanning…" status, fetch bookmarks for
// the open chat, populate fwdLines, and return true if any matched. On empty
// or error, fills the dialog with the appropriate message and returns false.
// `verb` is shown in the empty-state hint so the user knows whether they're
// being told to "forward" or "copy".
async function scanCurrentChatBookmarks(verb) {
  if (!current) { await showAlert(`Open a ping first, then click ${verb}.`); return false; }
  fwdSummary.innerHTML = '';
  fwdList.innerHTML = '';
  fwdSearch.style.display = 'none';
  fwdOverlay.classList.add('show');
  setFwdStatus('Scanning this conversation for bookmarks…');
  let r;
  try { r = await bp.listBookmarks(current.bucket, current.chat); }
  catch (e) { setFwdStatus('Error: ' + e.message); return false; }
  if (r && r.error) { setFwdStatus('Error: ' + r.error); return false; }
  const matching = (r && r.bookmarks) || [];
  if (!matching.length) {
    setFwdStatus('');
    fwdSummary.innerHTML =
      `<b>No bookmarked messages found in <i>${esc(current.name)}</i>.</b><br>` +
      `In the Basecamp pane on the right, click the “…” next to each comment you want ` +
      `to ${verb} and choose <b>Bookmark</b>. Then click ${verb} again.`;
    return false;
  }
  fwdLines = matching;
  return true;
}

async function openForward() {
  $('#fwdTitle').textContent = 'Forward bookmarked messages';
  const ok = await scanCurrentChatBookmarks('forward');
  if (!ok) return;
  fwdSummary.innerHTML = `<b>${fwdLines.length}</b> bookmarked message` +
    `${fwdLines.length === 1 ? '' : 's'} from <i>${esc(current.name)}</i> will be forwarded.`;
  setFwdStatus('Pick a recipient:');
  fwdSearch.style.display = '';
  fwdSearch.value = ''; fwdSearch.focus();
  // Warm the people cache (used to suggest non-pingable contacts when typed
  // search comes up empty), then paint the default list.
  ensurePeopleCache().then(() => { if (!fwdSearch.value) renderRecipients(''); });
  renderRecipients('');
}

async function openCopy() {
  $('#fwdTitle').textContent = 'Copy bookmarked messages';
  const ok = await scanCurrentChatBookmarks('copy');
  if (!ok) return;
  // No recipient step for copy — go straight to clipboard.
  fwdSearch.style.display = 'none';
  fwdList.innerHTML = '';
  fwdSummary.innerHTML = `Copying <b>${fwdLines.length}</b> bookmarked message` +
    `${fwdLines.length === 1 ? '' : 's'} from <i>${esc(current.name)}</i>…`;
  setFwdStatus('');
  await runCopy();
}

// Recipient roster cache (full account, can_ping only). Used to expand
// search when the user types — defaults stay restricted to people the user
// already has a ping with (we need a known bucket+chat to POST a line).
let peopleAll = [];
async function ensurePeopleCache() {
  if (peopleAll.length) return;
  try { const r = await bp.listPeople(); peopleAll = (r && r.people) || []; } catch (e) {}
}
function renderRecipients(q) {
  const filter = (q || '').toLowerCase().trim();
  fwdList.innerHTML = '';
  // Default candidates: people in my current pings list (we know bucket+chat).
  const pingable = peopleData
    .filter(p => String(p.chat) !== String(current.chat))    // exclude the open chat itself
    .map(p => ({ id: p.chat, name: p.name, avatar: p.avatar, bucket: p.bucket, chat: p.chat }));
  let candidates = pingable;
  if (filter) candidates = candidates.filter(p => p.name.toLowerCase().includes(filter));
  if (!candidates.length) {
    let note;
    if (filter) {
      // Mention any matching account people we found but can't send to (no existing ping).
      const acctMatches = peopleAll.filter(p => p.name && p.name.toLowerCase().includes(filter));
      if (acctMatches.length) {
        note = `No matching recipients in your pings list. ` +
               `Start a ping in Basecamp first with ` +
               `${acctMatches.slice(0,3).map(p => p.name).join(', ')}, ` +
               `then forward.`;
      } else {
        note = `No matches.`;
      }
    } else {
      note = `No other ping conversations available.`;
    }
    fwdList.innerHTML = `<div class="fwd-empty">${esc(note)}</div>`;
    return;
  }
  for (const p of candidates) {
    const b = document.createElement('button');
    b.className = 'fwd-item';
    b.innerHTML = `<img class="avatar" src="${esc(p.avatar)}" alt="">` +
                  `<span class="name">${esc(p.name)}</span>`;
    b.onclick = () => sendForward(p);
    fwdList.appendChild(b);
  }
}
fwdSearch.addEventListener('input', () => renderRecipients(fwdSearch.value));

// Basecamp chat lines accept text/html but only with:
//   div, h1, br, strong, em, strike, a[href], pre, ol, ul, li, blockquote
// — anything else risks 422 / strip. Map <p> → <div>, strip <bc-attachment>.
function cleanForwardHtml(html) {
  if (!html) return '';
  return String(html)
    .replace(/<bc-attachment[\s\S]*?<\/bc-attachment>/gi, '[attachment — view original in Basecamp]')
    .replace(/<p(\s[^>]*)?>/gi, '<div>')
    .replace(/<\/p>/gi, '</div>');
}
// Human-readable byte size: "37 KB", "1.2 MB", etc.
function humanSize(n) {
  if (!n || n < 0) return '';
  if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB';
  if (n >= 1024) return Math.round(n / 1024) + ' KB';
  return n + ' B';
}
function attachmentLabel(att) {
  const name = att.filename || att.title || 'attachment';
  const detail = [att.content_type, humanSize(att.byte_size)].filter(Boolean).join(', ');
  return detail ? `${name} (${detail})` : name;
}
// Best clickable link for the attachment: the line's app_url opens the chat
// line in Basecamp's web app, where the recipient (who has a Basecamp login)
// sees the attachment inline. The attachment's preview/download URLs require
// session cookies, so they don't render cleanly elsewhere.
function attachmentHref(line, att) {
  return line.app_url || att.url || att.download_url || '';
}

function isImageAttachment(att) {
  return /^image\//i.test((att && att.content_type) || '');
}

// HTML body of a single line — text content, attachments, or both.
// Used for both Forward and Copy. Attachment-only lines (Chat::Lines::Upload)
// have content==null and a populated attachments[].
//
// opts.dataUriImages — when true (Copy), images with a pre-fetched _dataUri
// are emitted as <img src="data:image/...;base64,..."> so the binary is
// embedded directly in the HTML — no external URL for Basecamp's paste
// sanitizer to strip. A filename link is emitted below the image as a
// caption / fallback (so even if Basecamp ALSO strips data: URIs, the user
// still has a clickable link to the original). Non-image attachments
// remain filename links. Forward leaves this off.
function lineBodyHtml(line, opts) {
  const dataUriImages = !!(opts && opts.dataUriImages);
  const parts = [];
  if (line.content) parts.push(cleanForwardHtml(line.content));
  for (const a of (line.attachments || [])) {
    const label = esc(attachmentLabel(a));
    const href = attachmentHref(line, a);
    if (dataUriImages && isImageAttachment(a) && a._dataUri) {
      parts.push(
        `<div><img src="${a._dataUri}" alt="${label}" style="max-width:640px;height:auto;display:block;"></div>` +
        (href ? `<div>📎 <a href="${esc(href)}">${label}</a></div>` : '')
      );
    } else {
      parts.push(href
        ? `<div>📎 <a href="${esc(href)}">${label}</a></div>`
        : `<div>📎 ${label}</div>`);
    }
  }
  return parts.join('');
}
// Plain-text body, symmetric with lineBodyHtml.
function lineBodyText(line) {
  const parts = [];
  if (line.content) parts.push(htmlToText(line.content));
  for (const a of (line.attachments || [])) {
    const label = attachmentLabel(a);
    const href = attachmentHref(line, a);
    parts.push(href ? `📎 ${label} — ${href}` : `📎 ${label}`);
  }
  return parts.join('\n\n');
}

// Who originally RECEIVED a message in the open ping: if I wrote it, the ping
// partner (current.name); otherwise me. (current.name is comma-joined for group
// pings, so a message I sent to a group reads "Me wrote to A, B".)
function fwdRecipientName(creator) {
  const cid = creator && creator.id;
  if (myself && cid === myself.id) return (current && current.name) || 'them';
  return (myself && myself.name) || 'me';
}

// HTML "Name wrote to Recipient:" lead line. The author's profile is linked so
// the forwarded-message reader can click through to ping them directly.
function fwdHeaderHtml(creator, recipientName) {
  const c = creator || {};
  const url = c.profile_url || '';
  const safeName = esc(c.name || 'Someone');
  const to = esc(recipientName || '');
  return url
    ? `<div><a href="${esc(url)}">${safeName}</a> wrote to ${to}:</div>`
    : `<div><strong>${safeName} wrote to ${to}:</strong></div>`;
}

// Compose the rich-text forward/copy payload.
//   - Consecutive comments by the same author share ONE "Name wrote:" header.
//   - Each comment body is wrapped in <blockquote> (Basecamp's chat HTML
//     allows it; renders indented in Mail/Notes/Basecamp).
//   - Blocks (header+blockquote or bare blockquote when the author repeats)
//     are joined by <div><br></div> to put a blank line between each
//     forwarded comment.
function composeForwardHtml(lines, opts) {
  const blocks = [];
  let lastCreatorId = null;
  for (const l of lines) {
    const c = l.creator || {};
    const body = lineBodyHtml(l, opts);
    if (!body) continue;   // genuinely-empty line — defensive, shouldn't happen
    let block = '';
    if (c.id !== lastCreatorId) {
      block += fwdHeaderHtml(c, fwdRecipientName(c));
      lastCreatorId = c.id;
    }
    block += `<blockquote>${body}</blockquote>`;
    blocks.push(block);
  }
  return blocks.join('<div><br></div>');
}

async function sendForward(recipient) {
  if (fwdSending || !recipient || !fwdLines.length) return;
  fwdSending = true;
  fwdSearch.disabled = true;
  setFwdStatus(`Forwarding ${fwdLines.length} message${fwdLines.length === 1 ? '' : 's'} to ${recipient.name}…`);
  // Compose one rich-text chat line containing every bookmarked comment,
  // with consecutive same-author runs grouped under one "wrote:" header
  // and each body wrapped in <blockquote>.
  const html = composeForwardHtml(fwdLines);
  let res;
  try { res = await bp.sendLine(recipient.bucket, recipient.chat, html); }
  catch (e) { setFwdStatus('Forward failed: ' + e.message); fwdSearch.disabled = false; fwdSending = false; return; }
  if (res && res.error) {
    setFwdStatus('Forward failed: ' + res.error);
    fwdSearch.disabled = false; fwdSending = false;
    return;
  }
  // Auto-DELETE each bookmark via its bookmark_url (verified working).
  let removed = 0, kept = 0;
  for (const l of fwdLines) {
    const dr = await bp.deleteBookmark(l.bookmark_url);
    if (dr && dr.ok) removed++; else kept++;
  }
  if (kept === 0) {
    setFwdStatus(`Forwarded ${fwdLines.length} message${fwdLines.length === 1 ? '' : 's'} to ${recipient.name}. Bookmarks cleared.`, true);
  } else {
    setFwdStatus(`Forwarded to ${recipient.name}. ${kept} bookmark${kept === 1 ? '' : 's'} couldn't be auto-removed — un-bookmark in Basecamp manually.`, true);
  }
  // Refresh the pings list so the new sent line bumps the recipient up.
  loadPeople({ forceFull: true });
  setTimeout(closeForward, 1800);
}

// ---- Copy bookmarked messages to clipboard ----
// Sister of Forward: same bookmark scan, but writes the composed blocks to
// the system clipboard (both rich text and plain text), then auto-removes
// the bookmarks. No recipient picker.
function htmlToText(html) {
  if (!html) return '';
  // Map block-level closers to newlines BEFORE stripping tags so paragraphs
  // and divs render as actual line breaks in plain text. Paragraphs (<p>),
  // blockquotes, and headings are "real" block separators → BLANK LINE
  // between them (\n\n). Divs and list items are single line breaks (\n).
  // This was the bug behind #4: <p>p1</p><p>p2</p> was collapsing to
  // "p1\np2" because </p> mapped to a single \n.
  const prepped = String(html)
    .replace(/<br\s*\/?>/gi, '\n')
    .replace(/<\/(p|blockquote|h[1-6])>/gi, '\n\n')
    .replace(/<\/(div|li)>/gi, '\n')
    .replace(/<bc-attachment[\s\S]*?<\/bc-attachment>/gi, '[attachment]');
  const tmp = document.createElement('div');
  tmp.innerHTML = prepped;
  return (tmp.textContent || '').replace(/\n{3,}/g, '\n\n').trim();
}

// Mail-style ">" quote prefix on every line, including blank lines (so the
// reader can see at-a-glance that the entire passage is quoted).
function quotePlain(text) {
  if (!text) return '';
  return text.split('\n').map(line => line ? '> ' + line : '>').join('\n');
}

// Compose the plain-text copy payload — mirrors composeForwardHtml:
//   - Consecutive comments by the same author share one "Name wrote:" header.
//   - Each comment body is quote-prefixed.
//   - Blocks are joined by a blank line (\n\n).
function composeCopyText(lines) {
  const blocks = [];
  let lastCreatorId = null;
  for (const l of lines) {
    const c = l.creator || {};
    const body = lineBodyText(l);
    if (!body) continue;   // defensive
    let block = '';
    if (c.id !== lastCreatorId) {
      const name = c.name || 'Someone';
      const url  = c.profile_url || '';
      block += (url ? `${name} wrote: (${url})` : `${name} wrote:`) + '\n';
      lastCreatorId = c.id;
    }
    block += quotePlain(body);
    blocks.push(block);
  }
  return blocks.join('\n\n');
}

async function runCopy() {
  if (fwdSending || !fwdLines.length) return;
  fwdSending = true;

  // Pre-fetch each image attachment as a data: URI so the binary lives
  // directly in the clipboard HTML — no external URL for Basecamp's paste
  // sanitizer to strip. (External <img src="https://preview.app.basecamp..."
  // is stripped on paste, even though the URL is from a Basecamp host.)
  const MAX_BYTES = 5 * 1024 * 1024;
  const imgs = [];
  for (const l of fwdLines) {
    for (const a of (l.attachments || [])) {
      if (isImageAttachment(a) && a.download_url) imgs.push(a);
    }
  }
  if (imgs.length) {
    setFwdStatus(`Downloading ${imgs.length} image${imgs.length === 1 ? '' : 's'}…`);
    let done = 0, i = 0;
    const CONCURRENCY = 4;
    async function worker() {
      while (i < imgs.length) {
        const a = imgs[i++];
        try {
          const fr = await bp.fetchAttachmentDataUri(a.download_url, MAX_BYTES);
          if (fr && fr.ok) a._dataUri = `data:${fr.mime};base64,${fr.base64}`;
        } catch (e) { /* fall through to link */ }
        done++;
        setFwdStatus(`Downloading ${done}/${imgs.length} image${imgs.length === 1 ? '' : 's'}…`);
      }
    }
    await Promise.all(Array.from({ length: CONCURRENCY }, worker));
  }

  const html = composeForwardHtml(fwdLines, { dataUriImages: true });
  const text = composeCopyText(fwdLines);
  setFwdStatus('Writing to clipboard…');
  let cw;
  try { cw = await bp.writeClipboard(text, html); }
  catch (e) { setFwdStatus('Copy failed: ' + e.message); fwdSending = false; return; }
  if (!cw || !cw.ok) {
    setFwdStatus('Copy failed: ' + ((cw && cw.error) || 'unknown'));
    fwdSending = false;
    return;
  }

  // Auto-DELETE each bookmark.
  let removed = 0, kept = 0;
  for (const l of fwdLines) {
    const dr = await bp.deleteBookmark(l.bookmark_url);
    if (dr && dr.ok) removed++; else kept++;
  }
  const n = fwdLines.length;
  const totalAtts = fwdLines.reduce((s, l) => s + ((l.attachments || []).length), 0);
  const attNote = totalAtts ? ` (incl. ${totalAtts} attachment${totalAtts === 1 ? '' : 's'})` : '';
  if (kept === 0) {
    setFwdStatus(`Copied ${n} message${n === 1 ? '' : 's'} to clipboard${attNote}. Bookmarks cleared.`, true);
  } else {
    setFwdStatus(`Copied ${n} message${n === 1 ? '' : 's'} to clipboard${attNote}. ${kept} bookmark${kept === 1 ? '' : 's'} couldn't be auto-removed — un-bookmark in Basecamp manually.`, true);
  }
  setTimeout(closeForward, 2000);
}

$('#forwardBtn').onclick = openForward;
$('#copyBtn').onclick = openCopy;

// Log real (non-aborted) webview load failures to the main-window console.
// ERR_ABORTED (-3) fires every time main.js diverts a navigation to the
// system browser — that's expected, not a real failure.
frame.addEventListener('did-fail-load', e => {
  if (e.errorCode === -3) return;
  console.warn('[webview did-fail-load]', e.errorCode, e.errorDescription, e.validatedURL);
});

// ⌘⌥⇧I (Ctrl+Alt+Shift+I on Windows) opens DevTools on the chat <webview>
// (separate from the main window's DevTools at ⌘⌥I). Useful for debugging
// login/navigation issues with Basecamp's own JS.
window.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.altKey && e.shiftKey && (e.key === 'I' || e.key === 'i')) {
    e.preventDefault();
    try { frame.openDevTools(); } catch (err) { console.warn('openDevTools failed:', err); }
  }
});

boot();
</script>
</body>
</html>
